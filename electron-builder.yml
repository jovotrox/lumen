appId: com.lumen.notes
productName: Lumen
copyright: Copyright © 2024

directories:
  output: release
  buildResources: electron/icons

files:
  - electron/dist/**/*
  - electron/icons/**/*
  - package.json

extraMetadata:
  main: electron/dist/main.cjs

mac:
  category: public.app-category.productivity
  icon: electron/icons/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

win:
  icon: electron/icons/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  icon: electron/icons/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: jovotrox
  repo: lumen
