name: Deploy to GitHub Pages

on:
  push:
    branches: [personal]
    paths-ignore:
      - "src-tauri/**" # No deploy si solo cambia Tauri
  workflow_dispatch: # Permite trigger manual desde GitHub Actions UI

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Generate version.json
        run: |
          SHELL_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "{
            \"frontend\": \"$(git rev-parse --short HEAD)\",
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"shell\": \"${SHELL_VERSION}\"
          }" > dist/version.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
