name: Electron Release

on:
  push:
    branches: [personal]
    paths:
      - "electron/**"
      - "electron-builder.yml"
      - "package.json"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify-version:
    # Fails fast if package.json version wasn't bumped before merge.
    # Skipped on tag pushes (tag itself guarantees version is new) and manual dispatch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version not yet released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Bump package.json version before merging to personal. See CLAUDE.md 'Versionado' section."
            exit 1
          fi
          echo "✓ v$VERSION is new — proceeding with build"

  build:
    needs: verify-version
    # Run even if verify-version was skipped (tag push / manual dispatch)
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main process
        run: npm run electron:build-main

      - name: Build Electron app
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
