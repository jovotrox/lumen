<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon-512.png" />
    <meta name="theme-color" content="" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler
      (function () {
        var redirect = sessionStorage.getItem("redirect")
        if (redirect) {
          sessionStorage.removeItem("redirect")
          // Remove /lumen prefix if present (GitHub Pages base path)
          var path = redirect.replace(/^\/lumen/, "")
          if (path && path !== "/" && path !== window.location.pathname) {
            history.replaceState(null, "", path)
          }
        }
      })()
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
